  path_provider: ^2.1.3
  permission_handler: ^13.0.2
  photo_view: ^0.15.0
  pinput: ^6.0.2
  pretty_dio_logger: ^1.3.1
  easy_localization: ^3.0.7
  socket_io_client: ^3.1.6
  rename: ^3.0.2
  shimmer_animation: ^2.2.1
  smooth_page_indicator: ^3.0.0
  table_calendar: ^3.1.2
  timeago: ^3.6.1
  timeline_tile: ^2.0.0
  url_launcher: ^6.3.0
  uuid: ^4.4.2
  video_player: ^2.9.5
  chewie: ^1.13.0
  audioplayers: ^6.1.0
  record: ^7.1.1
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.15.0
  dartz: ^0.10.1
  get_it: ^9.0.5
  internet_connection_checker_plus: ^3.1.1 
  mockito: ^5.4.5


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1
  cached_network_svg_image: ^2.0.0  
  flutter_secure_storage: ^11.0.0
  lazy_load_indexed_stack: ^1.2.1
  hydrated_bloc: ^11.0.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - i18n/
    - assets/
    - assets/global_icon/
    - assets/images/
    - assets/svg/
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/Gelasio-OFL.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Gelasio
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gelasio-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gelasio-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gelasio-Bold.ttf
          weight: 700
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_assets:
  assets_path: assets/
  output_path: lib/core/images/
  filename: app_images.dart
  classname: AppImages
